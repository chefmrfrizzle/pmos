name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=packages/research pytest packages/research/tests -q
      - run: PYTHONPATH=packages/research python scripts/public_release_check.py
